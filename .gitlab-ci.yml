default:
  image: node:latest

cache:
  key: $CI_MERGE_REQUEST_ID
  paths:
    - node_modules/

stages:
  - init
  - cleanup
  - test
  - build
  - pre-release
  - release

init:
  stage: init
  script:
    - echo "Testing ENVARs are exported..."
    - ./.gitlab/pipeline_tests/test-envar-exports.sh
    - echo "Exporting ENVARs..."
    - ./.gitlab/pipeline_utils/envars.sh
    - echo "Installing dependencies..."
    - npm ci
  artifacts:
    expire_in: 1h
    reports:
      dotenv: vars.env
  rules:
    # Don't run if we're in the cleanup-dev schedule
    - if: $CPR_SCHEDULE == "cleanup-dev"
    # Run on MRs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run on merge to 'dev'
    - if: $CI_COMMIT_BRANCH == "dev"
    # Run on git tag
    - if: $CI_COMMIT_TAG

delete-packages-dev:
  stage: cleanup
  script:
    - apt-get update
    - apt-get install jq --yes
    - echo "Deleting old dev releases... "
    - ./.gitlab/pipeline_utils/cleanup.sh
  needs:
    - job: init
      artifacts: true
  rules:
    - if: $CPR_SCHEDULE == "cleanup-dev"

lint-code:
  stage: test
  script:
    - echo "Linting code..."
    - npm run lint
  needs:
    - job: init
      artifacts: true
  rules:
    # Don't run if we're in the cleanup-dev schedule
    - if: $CPR_SCHEDULE == "cleanup-dev"
      when: never
    # Run on MRs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run on merge to 'dev'
    - if: $CI_COMMIT_BRANCH == "dev"
    # Run on git tag
    - if: $CI_COMMIT_TAG

