default:
  image: node:latest

cache:
  key: $CI_MERGE_REQUEST_ID
  paths:
    - node_modules/

stages:
  - init
  - test
  - build
  - pre-release
  - release

init:
  stage: init
  script:
    - echo "Testing ENVARs are exported..."
    - ./.gitlab/pipeline_tests/test-envar-exports.sh
    - echo "Generating envars..."
    - ./.gitlab/pipeline_utils/envars.sh
    - echo "Installing dependencies..."
    - npm install
  artifacts:
    expire_in: 1h
    reports:
      dotenv: vars.env
  only:
    refs:
      - merge_requests
      - tags
      - dev

lint:
  stage: test
  script:
    - echo "Linting code..."
    - npm run lint
  needs:
    - job: init
      artifacts: true
  only:
    refs:
      - merge_requests
      - tags

unit-test:
  stage: test
  script:
    - echo "Executing tests..."
    - npm test
  needs:
    - job: init
      artifacts: true
  only:
    refs:
      - merge_requests
      - tags
      - dev

test-shell-scripts:
  stage: test
  before_script:
    - apt-get update
    - apt-get install shellcheck
  script:
    - ./.gitlab/pipeline_tests/test-shell-scripts.sh
  needs:
    - job: init
      artifacts: true
  only:
    refs:
      - merge_requests
      - tags
      - dev
    changes:
      - "**/*.sh"

language-unused-strings:
  stage: test
  script:
    - echo "Checking language file for unused strings..."
    - ./.gitlab/pipeline_tests/test-lang-file.sh
  needs:
    - job: init
      artifacts: true
  only:
    refs:
      - merge_requests
      - tags
      - dev

language-exists:
  stage: test
  before_script:
    - apt-get update
    - apt-get install jq --yes
  script:
    - echo "Checking if all the language files specified in system.json exist..."
    - ./.gitlab/pipeline_tests/test-lang-existence.sh
  needs:
    - job: init
      artifacts: true
  only:
    refs:
      - merge_requests
      - tags
      - dev

changelog-has-changed:
  stage: test
  script:
    - echo "Checking if the CHANGELOG.md changed..."
    - git fetch origin ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}
    - ./.gitlab/pipeline_tests/test-changelog-dev-changed.sh
  allow_failure: true
  needs:
    - job: init
      artifacts: true
  only:
    refs:
      - merge_requests

trace-statements:
  stage: test
  script:
    - echo "Checking if there are proper trace statements in all hbs files..."
    - ./.gitlab/pipeline_tests/test-handlebars-trace.sh
  needs:
    - job: init
      artifacts: true
  only:
    refs:
      - merge_requests
      - tags
      - dev

code-localization:
  stage: test
  script:
    - echo "Checking if our own localization and notification code is used..."
    - ./.gitlab/pipeline_tests/test-misc.sh
  needs:
    - job: init
      artifacts: true
  only:
    refs:
      - merge_requests
      - tags
      - dev

handlebars-helpers:
  stage: test
  script:
  - echo "Checking use of handlebars helpers..."
  - ./.gitlab/pipeline_tests/test-handlebars-helpers.sh
  needs:
    - job: init
      artifacts: true
  only:
    refs:
      - merge_requests
      - tags
      - dev

game-id:
  stage: test
  script:
    - echo "Making sure game.system.id is used appropriately..."
    - ./.gitlab/pipeline_tests/test-game-ids.sh
  needs:
    - job: init
      artifacts: true
  only:
    refs:
      - merge_requests
      - tags
      - dev

compendia-use:
  stage: test
  script:
    - echo "Making sure compendia APIs are used..."
    - ./.gitlab/pipeline_tests/test-compendia-use.sh
  needs:
    - job: init
  only:
    refs:
      - merge_requests
      - tags
      - dev

# Build without artifacts when not tagging a release
test-build:
  stage: test
  script:
    - echo "Building cyberpunk-red-core..."
    - npm run build
  needs:
    - job: init
      artifacts: true
  only:
    refs:
      - merge_requests

# Builds and Uploads artifacts the gitlab generic repo
build-artifacts:
  stage: build
  before_script:
    - apt-get update
    - apt-get install curl zip jq -y
  script:
    - echo "Building cyberpunk-red-core..."
    - ./.gitlab/pipeline_utils/build.sh
  needs:
    - job: init
      artifacts: true
    - job: unit-test
    - job: test-shell-scripts
      optional: true
    - job: language-unused-strings
    - job: language-exists
    - job: changelog-has-changed
      optional: true
    - job: trace-statements
    - job: code-localization
    - job: handlebars-helpers
    - job: test-build
      optional: true
  only:
    refs:
      - tags
      - dev

# Creates a GitLab release with the previously uploaded artifacts
create-release:
  stage: build
  before_script:
    - apt-get update
    - apt-get install curl jq -y
    - curl --silent --location --output /usr/local/bin/release-cli "https://release-cli-downloads.s3.amazonaws.com/latest/release-cli-linux-amd64"
    - chmod +x /usr/local/bin/release-cli
  script:
    - echo "Running Release Job..."
    - ./.gitlab/pipeline_utils/release.sh
  needs:
    - job: init
      artifacts: true
    - job: build-artifacts
  only:
    refs:
      - tags

# Pre-release tests
pre-release:
  stage: pre-release
  before_script:
    - apt-get update
    - apt-get install curl zip jq -y
  script:
    - echo "Running Pre Release Checks"
    - ./.gitlab/pipeline_tests/pre-release-checks.sh
  needs:
    - job: init
      artifacts: true
    - job: build-artifacts
    - job: create-release
  only:
    refs:
      - tags

# Build the `latest` system.json and upload to gitlab generic repo
# This makes the release available in Foundry
publish:
  stage: release
  before_script:
    - apt-get update
    - apt-get install curl jq -y
  script:
    - echo "Releasing cyberpunk-red-core..."
    - ./.gitlab/pipeline_utils/publish.sh
  needs:
    - job: init
      artifacts: true
    - job: build-artifacts
    - job: pre-release
      optional: true
  only:
    refs:
      - tags
      - dev
