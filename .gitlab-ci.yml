# Build without artifacts when not tagging a release
test-build:
  stage: test
  script:
    - echo "Building cyberpunk-red-core..."
    - npm run build
  needs:
    - job: init
      artifacts: true
  rules:
    # Don't run if we're in the cleanup-dev schedule
    - if: $CPR_SCHEDULE == "cleanup-dev"
      when: never
    # Run on MRs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Builds and Uploads artifacts the gitlab generic repo
build-artifacts:
  stage: build
  before_script:
    - apt-get update
    - apt-get install curl zip jq -y
  script:
    - echo "Building cyberpunk-red-core..."
    - ./.gitlab/pipeline_utils/build.sh
  needs:
    - job: init
      artifacts: true
    - job: lint-code
    - job: code-formatting
    - job: lint-json
    - job: lint-yaml
    - job: lint-markdown
    - job: lint-handlebars
    - job: unit-test
    - job: test-shell-scripts
      optional: true
    - job: language-unused-strings
    - job: language-exists
    - job: game-id
    - job: compendia-use
    - job: trace-statements
    - job: tag-statements
    - job: code-localization
    - job: handlebars-helpers
    - job: handlebars-formatting
    - job: tooltips
    - job: test-build
      optional: true
  rules:
    # Don't run if we're in the cleanup-dev schedule
    - if: $CPR_SCHEDULE == "cleanup-dev"
      when: never
    # Run on MRs
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Run on git tag
    - if: $CI_COMMIT_TAG

# Creates a GitLab release with the previously uploaded artifacts
create-release:
  stage: build
  before_script:
    - apt-get update
    - apt-get install curl jq -y
    - curl --silent --location --output /usr/local/bin/release-cli "https://release-cli-downloads.s3.amazonaws.com/latest/release-cli-linux-amd64"
    - chmod +x /usr/local/bin/release-cli
  script:
    - echo "Running Release Job..."
    - ./.gitlab/pipeline_utils/release.sh
  needs:
    - job: init
      artifacts: true
    - job: build-artifacts
  rules:
    # Don't run if we're in the cleanup-dev schedule
    - if: $CPR_SCHEDULE == "cleanup-dev"
      when: never
    # Run on git tag
    - if: $CI_COMMIT_TAG

# Pre-release tests
pre-release:
  stage: pre-release
  before_script:
    - apt-get update
    - apt-get install curl zip jq -y
  script:
    - echo "Running Pre Release Checks"
    - ./.gitlab/pipeline_tests/pre-release-checks.sh
  needs:
    - job: init
      artifacts: true
    - job: build-artifacts
    - job: create-release
  rules:
    # Don't run if we're in the cleanup-dev schedule
    - if: $CPR_SCHEDULE == "cleanup-dev"
      when: never
    # Run on git tag
    - if: $CI_COMMIT_TAG

# Build the `latest` system.json and upload to gitlab generic repo
# This makes the release available in Foundry
publish:
  stage: release
  before_script:
    - apt-get update
    - apt-get install curl jq -y
  script:
    - echo "Releasing cyberpunk-red-core..."
    - ./.gitlab/pipeline_utils/publish.sh
  needs:
    - job: init
      artifacts: true
    - job: build-artifacts
    - job: pre-release
      optional: true
  rules:
    # Don't run if we're in the cleanup-dev schedule
    - if: $CPR_SCHEDULE == "cleanup-dev"
      when: never
    # Run on MRs
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Run on git tag
    - if: $CI_COMMIT_TAG

# Close all Issues included in a release
manage-issues-on-release:
  stage: release
  image: mvdan/shfmt:latest-alpine
  before_script:
    - apk update
    - apk add bash jq curl
  script:
    - echo "Managing Issues..."
    - ./.gitlab/pipeline_utils/manage-issues-on-release.sh
  needs:
    - job: init
      artifacts: true
    - job: create-release
  rules:
    # Don't run if we're in the cleanup-dev schedule
    - if: $CPR_SCHEDULE == "cleanup-dev"
      when: never
    # Run on git tag
    - if: $CI_COMMIT_TAG
