# Run the browser end-to-end tests (Playwright driving a real Foundry world).
#
# Foundry is not redistributable and CI has no local install, so this job pulls
# the Foundry "Node" build from foundryvtt.com using account credentials (see
# .gitlab/pipeline_utils/download-foundry.sh). It needs these CI/CD variables
# (Settings > CI/CD > Variables — mask them, and protect them so they are not
# exposed to fork pipelines):
#   FOUNDRY_USER         foundryvtt.com account username/email (download)
#   FOUNDRY_PASS         foundryvtt.com account password (download)
#   FOUNDRY_LICENSE_KEY  license key (activates Foundry on first launch)
#
# The Foundry version is derived: the script installs the latest build of the
# generation in src/system.json (compatibility.verified). The suite is
# Chromium-only (see .playwright/playwright.config.mjs).

test-browser:
  stage: test
  # The official Playwright image ships the browsers and their OS deps already
  # installed (matched to the pinned @playwright/test), so there is no flaky
  # `playwright install` step. node_modules from the cache is N-API/prebuilt and
  # works under this image's Node too.
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  variables:
    # Where this job installs Foundry and points its user data. The harness reads
    # these from the environment; gulp's build reads dataPath from the
    # foundryconfig.json written below.
    FOUNDRY_APP_PATH: "$CI_PROJECT_DIR/.foundry/app"
    FOUNDRY_DATA_PATH: "$CI_PROJECT_DIR/.foundry/data"
  before_script:
    - apt-get update
    - apt-get install -y curl unzip jq
    # Download + unpack the latest Foundry build for the targeted generation.
    - ./.gitlab/pipeline_utils/download-foundry.sh
    # gulp build deploys the system into <dataPath>/Data/systems and reads that
    # path from foundryconfig.json; the license is taken from FOUNDRY_LICENSE_KEY.
    - printf '{"foundry":{"appPath":"%s","dataPath":"%s"}}\n' "$FOUNDRY_APP_PATH" "$FOUNDRY_DATA_PATH" > foundryconfig.json
  script:
    - npm run test:browser
  # Post/refresh the single MR comment (sheet gallery + any failed-test table) on
  # both pass and fail. Best-effort: a reporting failure won't fail the job.
  after_script:
    - ./.gitlab/pipeline_utils/post-browser-report.sh
  artifacts:
    when: always
    expire_in: 1 week
    # JUnit lets GitLab surface results in the pipeline/MR "Tests" tab; the rest
    # are Playwright traces/screenshots kept for failures.
    reports:
      junit: .playwright/test-results/junit.xml
    # Keep the silenced build/Foundry logs too, so a failure in those phases is
    # diagnosable from artifacts without un-silencing the job log.
    paths:
      - .playwright/test-results/
      - .playwright/build.log
      - .playwright/auth/foundry.log
  needs:
    - job: init
      artifacts: true
  rules:
    # Don't run if we're in the cleanup-dev schedule
    - if: $CPR_SCHEDULE == "cleanup-dev"
      when: never
    # Run on MRs that touch system code/templates/styles or the browser suite.
    # Deliberately excludes packs, lang, babele, and image/scene assets.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/test/test-browser.yml
        - .gitlab/pipeline_utils/download-foundry.sh
        - .gitlab/pipeline_utils/post-browser-report.sh
        - .playwright/playwright.config.mjs
        - src/cpr.js
        - src/css/**/*
        - src/environment.js
        - src/modules/**/*
        - src/system.json
        - src/template.json
        - src/templates/**/*
        - tests/browser/**/*
        - tools/foundry-server/**/*
    # Run on merge to 'dev' when those same files change.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab/ci/test/test-browser.yml
        - .gitlab/pipeline_utils/download-foundry.sh
        - .gitlab/pipeline_utils/post-browser-report.sh
        - .playwright/playwright.config.mjs
        - src/cpr.js
        - src/css/**/*
        - src/environment.js
        - src/modules/**/*
        - src/system.json
        - src/template.json
        - src/templates/**/*
        - tests/browser/**/*
        - tools/foundry-server/**/*
    # Always run on a release tag
    - if: $CI_COMMIT_TAG
