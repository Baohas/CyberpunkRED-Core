      - 3
    text: >-
      The High Priestess. The target is dealt the Foreign Object Critical
      Injury. When moving more than 4 m/yards, instead of taking the Critical
      Injury Bonus Damage, they must beat a DV 15 Resist Torture/Drugs Skill
      Check or take 3d6 Damage directly to their HP. (See Night City Tarot Page
      3).
