    text: >-
      The Hierophant. Double the damage the Attack would've dealt after armor
      and modifiers. (Just like how you would double the damage on an Aimed Shot
      to the Head). If the Attack was made with a weapon, that weapon is now
      Destroyed Beyond Repair. (See Night City Tarot Page 3).
