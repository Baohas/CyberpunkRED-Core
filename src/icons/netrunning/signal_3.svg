  <title
     id="title1">Pixelated white WiFi signal logo</title>
  <desc
     id="desc1">Pixel-art WiFi symbol in white on a gray background: three solid curved signal bands with 45-degree legs above a diamond dot. No shadow, no internal gridlines.</desc>
